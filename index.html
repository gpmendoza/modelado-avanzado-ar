<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modelo AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    body { margin:0; }
    model-viewer { width:100vw; height:100vh; }
  </style>
</head>
  <div id="diag" style="position:fixed;top:0;left:0;right:0;background:#000;color:#0f0;font:14px monospace;padding:8px;z-index:9999;"></div>
<body>
  <model-viewer
    src="Astronaut.glb"
    alt="Modelo 3D"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate>
  </model-viewer>
</body>
</html>
